[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nachos"
dynamic = ["version"]
authors = [
    {name = "lduchosal", email = "lduchosal@github.com"},
]
description = "A CLI tool to manage Nagios Core via HTTP REST API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
keywords = ["nagios", "monitoring", "cli", "api", "devops"]
dependencies = [
    "click>=8.0,<9.0",
    "certifi>=2024.0",
]

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "mypy>=0.800",
    "ruff>=0.1.0",
    "pdm>=2.0.0",
    "pdm-bump",
    "interrogate>=1.7.0",
    "import-linter>=2.11",
    "vulture>=2.14",
    "refurb>=2.2.0",
]
publish = [
    "twine>=6.2.0",
    "keyring>=25.7.0",
]

[project.urls]
Homepage = "https://github.com/lduchosal/nagioscli"
"Bug Reports" = "https://github.com/lduchosal/nagioscli/issues"
Source = "https://github.com/lduchosal/nagioscli"
Documentation = "https://github.com/lduchosal/nagioscli/blob/main/README.md"

[project.scripts]
nagioscli = "nagioscli.cli:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.coverage.run]
# The `python -m nagioscli` shim is never imported by tests; without this
# omit it pins min_file_cov (metrics gate) to 0.
omit = ["nagioscli/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[tool.pdm]
distribution = true
version = {source = "file", path = "nagioscli/__init__.py"}

[tool.pdm.scripts]
format = "ruff format"
typecheck = "mypy nagioscli/"
build = "python -m build"
install = "pdm install"
install-dev = "pdm install -G dev -G publish"
clihelp = "nagioscli --help"
cliproblems = "nagioscli problems"
cli = {composite = ["clihelp", "cliproblems"]}
all = {composite = ["install", "format", "build", "test", "cli"]}
test = "env PYTHONPATH=src python -m pytest tests/ -v --cov=nagioscli --cov-report=term-missing"
test-quick = "env PYTHONPATH=src python -m pytest tests/ --tb=no -q"
test-unit = "env PYTHONPATH=src python -m pytest tests/unit/ -v"
test-integration = "env PYTHONPATH=src python -m pytest tests/integration/ -v"
test-cov = "env PYTHONPATH=src python -m pytest tests/ -v --cov=nagioscli --cov-report=html --cov-report=term-missing"
lint = "ruff check nagioscli/ tests/"
arch = "lint-imports"
lint-fix = "ruff check --fix nagioscli/ tests/"
format-check = "black --check nagioscli/ tests/"
interrogate = "interrogate nagioscli/"
vulture = "vulture"
refurb = "refurb nagioscli/"
# Quality metrics snapshot & blocking gate (pattern semacli ken #828) —
# see doc/code-quality.md
metrics = "python scripts/quality_metrics.py"
metrics-record = "python scripts/quality_metrics.py --record"
metrics-gate = "python scripts/quality_metrics.py --gate"
# SonarCloud gate (pattern kenboard ken #835/#995) — polls the analysis of
# HEAD then blocks on the live quality gate. Publish-only (needs a pushed HEAD).
sonar-gate = "python scripts/sonar_gate.py --timeout 900 --interval 20 --max-wait 3600"
test-cov-xml = "env PYTHONPATH=src python -m pytest tests/ --cov=nagioscli --cov-report=xml --cov-report=term --cov-fail-under=80"
check = {composite = ["lint", "format-check", "typecheck", "arch", "vulture", "refurb", "test", "metrics-gate"]}
clean = "rm -rf .coverage htmlcov/ .pytest_cache/ __pycache__/ nagioscli/__pycache__/"
version-patch = "pdm bump patch"
version-minor = "pdm bump minor"
version-major = "pdm bump major"

[tool.pdm-bump]
version-files = [
    "nagioscli/__init__.py:__version__",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Quality-gate locks (pattern semacli/kenboard, doc/code-quality.md): each
# debt family that reaches zero in nagioscli/ is added here so the acquis
# becomes a lint error, and removed from DEBT_SELECT in
# scripts/quality_metrics.py. Locked at palier 1: G, SLF, PLC0415, ARG,
# PERF, RUF (already at zero at baseline).
select = [
    "E", "F", "W", "I", "UP", "B", "C4",
    "G", "SLF", "PLC0415",
    "ARG", "PERF", "RUF",
]
# E501: black owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from the src-hygiene families (same as semacli/kenboard):
# private access and lazy imports are legitimate test idioms. The metrics
# gate only measures nagioscli/.
"tests/**" = ["DTZ", "G", "SLF", "PLC0415", "ARG", "PERF", "PTH", "RUF", "BLE", "EM", "FBT", "TRY", "ANN401", "PLR"]

[tool.importlinter]
root_package = "nagioscli"

[[tool.importlinter.contracts]]
name = "cli imports services imports core, never the reverse"
type = "layers"
layers = ["nagioscli.cli", "nagioscli.services", "nagioscli.core"]

[[tool.importlinter.contracts]]
name = "command modules stay independent of each other"
type = "independence"
modules = [
    "nagioscli.cli.commands.ack",
    "nagioscli.cli.commands.check",
    "nagioscli.cli.commands.hosts",
    "nagioscli.cli.commands.login",
    "nagioscli.cli.commands.problems",
    "nagioscli.cli.commands.self_update",
    "nagioscli.cli.commands.services",
    "nagioscli.cli.commands.status",
]

[tool.vulture]
# Quality gate (doc/code-quality.md): dead-code findings are blocking.
min_confidence = 80
paths = ["nagioscli", "tests", "vulture_whitelist.py"]

[tool.interrogate]
# Current palier of the quality gate (doc/code-quality.md) — tightened at
# each palier, never relaxed without a traced human decision.
fail-under = 92
ignore-init-method = true
ignore-init-module = true
exclude = ["tests", "docs", "build", "dist"]
generate-badge = "."
badge-format = "svg"
