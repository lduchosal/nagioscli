sonar.projectKey=lduchosal_nagioscli
sonar.organization=lduchosal

# vscode/: the VS Code extension (ken #1132), JS analysed with the lcov the
# CI `vscode` job produces (node --test --experimental-test-coverage).
sonar.sources=nagioscli,vscode/src
sonar.tests=tests,vscode/test

sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=vscode/lcov.info

sonar.exclusions=dist/**,vscode/node_modules/**,build/**,**/__pycache__/**,interrogate_badge.svg,doc/**
sonar.coverage.exclusions=tests/**,vscode/test/**

# Scoped suppression: vscode/src/api.js sets rejectUnauthorized=false only
# when nagioscli.ini has verify_ssl=false — the same deliberate opt-in as
# core/client.py (NOSONAR there): self-signed Nagios certificates are the
# common case, so the CLI default is kept (ken #1132).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4830
sonar.issue.ignore.multicriteria.e1.resourceKey=vscode/src/api.js
