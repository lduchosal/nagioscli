# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pdm
        pdm install
        pdm install -G dev
    - name: Lint with ruff
      run: |
        pdm lint
    - name: Type check with mypy
      run: |
        pdm typecheck
    - name: Build with pdm
      run: |
        pdm build
    - name: Test with pytest + coverage
      run: |
        pdm run test-cov-xml
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
    - name: Upload coverage.xml for SonarCloud
      if: matrix.python-version == '3.13'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: error
        retention-days: 1

  vscode:
    # VS Code extension (ken #1132): same gates as publish.sh — lockfile
    # install, audit, biome, tsc on the JSDoc types, node --test with the
    # coverage gate. Its lcov feeds the SonarCloud analysis below.
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: vscode/package-lock.json
    - run: npm ci --no-fund
    - run: npm audit
    - run: npm run lint
    - run: npm run typecheck
    - run: npm run coverage
    # node writes SF: paths relative to vscode/, Sonar reads them from the root.
    - run: sed -i 's#^SF:#SF:vscode/#' lcov.info
    - name: Upload lcov.info for SonarCloud
      uses: actions/upload-artifact@v4
      with:
        name: vscode-lcov
        path: vscode/lcov.info
        if-no-files-found: error
        retention-days: 1

  sonarcloud:
    name: SonarCloud
    needs: [build, vscode]
    runs-on: ubuntu-latest
    # Fork PRs cannot read SONAR_TOKEN; skip the scan there to avoid a hard fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        # SonarCloud uses git blame to attribute issues to authors / new code.
        fetch-depth: 0
    - name: Download coverage.xml
      uses: actions/download-artifact@v4
      with:
        name: coverage-xml
    - name: Download the VS Code extension lcov.info
      uses: actions/download-artifact@v4
      with:
        name: vscode-lcov
        path: vscode
    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
