# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pdm build twine
        pdm install
    - name: Build package
      run: pdm build
    - name: Publish package
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      # publish.sh uploads to PyPI itself, then creates the GitHub release
      # that carries the VS Code .vsix (ken #1132) — which fires this
      # workflow. --skip-existing keeps it a no-op for those releases while
      # still publishing a release created by hand.
      run: |
        python -m twine upload --skip-existing dist/*
